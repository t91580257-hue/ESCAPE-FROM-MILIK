name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-android:
    name: Unzip project and export APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      GODOT_VERSION: 4.4.1
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PROJECT_ZIP: escape_from_milik_godot_project.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Unpack the uploaded Godot project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ZIP" || {
            echo "::error::Cannot find $PROJECT_ZIP in the repository root."
            echo "Upload the project ZIP next to the .github folder."
            exit 1
          }
          mkdir -p extracted_project
          unzip -q "$PROJECT_ZIP" -d extracted_project
          PROJECT_FILE="$(find extracted_project -type f -name project.godot -print -quit)"
          test -n "$PROJECT_FILE" || {
            echo "::error::No project.godot found inside the ZIP."
            exit 1
          }
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project found at: $PROJECT_DIR"

      - name: Download Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/builds"
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/builds/EscapeFromMilik.apk"
          test -s "$GITHUB_WORKSPACE/builds/EscapeFromMilik.apk"
          APK_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/builds/EscapeFromMilik.apk")
          APK_MIB=$((APK_SIZE / 1024 / 1024))
          echo "APK size: ${APK_MIB} MiB"
          if [ "$APK_SIZE" -gt 103809024 ]; then
            echo "::error::APK exceeds the 99 MiB hard limit."
            exit 1
          elif [ "$APK_SIZE" -gt 83886080 ]; then
            echo "::warning::APK is above the 80 MiB target but below the 99 MiB limit."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Escape-From-Milik-Android-APK
          path: builds/EscapeFromMilik.apk
          if-no-files-found: error
          retention-days: 14
