
name: Build Escape From Milik Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      GODOT_VERSION: "4.4.1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      # 1. Получение файлов репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Подготовка Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Установка Android-компонентов
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --install "platform-tools"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --install "platforms;android-34"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --install "build-tools;34.0.0"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --install "cmake;3.10.2.4988404"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --install "ndk;23.2.8568313"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

      # 5. Проверка Android SDK и Java
      - name: Verify Android environment
        shell: bash
        run: |
          set -euo pipefail

          java -version

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -d "$ANDROID_SDK_ROOT/build-tools/34.0.0"

          echo "Android SDK is ready."

      # 6. Установка Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 7. Проверка и распаковка ZIP
      - name: Extract game project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/escape_from_milik_optimized_20-24mb.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Game ZIP not found!"
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          python3 - "$ZIP_FILE" "$GITHUB_WORKSPACE/extracted_project" <<'PY'
          import sys
          import zipfile
          import os

          archive = sys.argv[1]
          destination = sys.argv[2]

          print("Checking ZIP archive...")

          with zipfile.ZipFile(archive, "r") as z:
              print("Files:", len(z.infolist()))

              methods = {}
              for item in z.infolist():
                  methods[item.compress_type] = (
                      methods.get(item.compress_type, 0) + 1
                  )

              print("Compression methods:", methods)

              bad = z.testzip()
              if bad:
                  raise RuntimeError(
                      "Corrupted ZIP file member: " + bad
                  )

              root = os.path.realpath(destination)

              for item in z.infolist():
                  target = os.path.realpath(
                      os.path.join(destination, item.filename)
                  )

                  if os.path.commonpath([root, target]) != root:
                      raise RuntimeError(
                          "Unsafe ZIP path: " + item.filename
                      )

              z.extractall(destination)

          print("ZIP successfully extracted.")
          PY

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -type f -name "project.godot" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found!"
            find "$GITHUB_WORKSPACE/extracted_project" \
              -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg not found!"
            exit 1
          fi

      # 8. Проверка Android-пресета
      - name: Verify Android export preset
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Eq 'name="Android"' \
            "$PROJECT_DIR/export_presets.cfg"; then
            echo "ERROR: Android export preset not found!"
            exit 1
          fi

          echo "Android export preset found."

      # 9. Скачивание Godot
      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/godot"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O "$RUNNER_TEMP/godot/godot.zip"

          unzip -q "$RUNNER_TEMP/godot/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          GODOT_BIN=$(find "$RUNNER_TEMP/godot" \
            -type f \
            -name "Godot_v*-stable_linux.x86_64" \
            | head -n 1)

          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found!"
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      # 10. Загрузка шаблонов экспорта
      - name: Download Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -O "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/template_extract"

          unzip -q "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/template_extract"

          TEMPLATE_SOURCE="$RUNNER_TEMP/template_extract/templates"

          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          if [ ! -d "$TEMPLATE_SOURCE" ]; then
            echo "ERROR: Export templates directory missing!"
            exit 1
          fi

          mkdir -p "$TEMPLATE_DEST"

          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DEST/"

          if [ ! -f "$TEMPLATE_DEST/android_debug.apk" ]; then
            echo "ERROR: Android debug template missing!"
            find "$TEMPLATE_DEST" -maxdepth 2 -type f
            exit 1
          fi

          echo "Godot templates installed."

      # 11. Настройка Godot Android
      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "Godot Android settings configured."

      # 12. Создание debug keystore
      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore ready."

      # 13. Импорт ресурсов проекта
      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --import \
            --quit

          echo "Project import completed."

      # 14. Экспорт APK
      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/builds"

          "$GODOT_BIN" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/builds/EscapeFromMilik.apk"

      # 15. Проверка APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/builds/EscapeFromMilik.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")

          echo "APK size: $SIZE_MB MiB"

          if [ "$SIZE" -gt 103809024 ]; then
            echo "ERROR: APK exceeds 99 MiB!"
            exit 1
          fi

          echo "APK verification completed."

      # 16. Загрузка APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Escape-From-Milik-Android-APK
          path: builds/EscapeFromMilik.apk
          if-no-files-found: error
          retention-days: 14
