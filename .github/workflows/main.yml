
name: Build Escape From Milik Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: 4.4.1
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Find and extract game ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 \
            -type f -name "escape_from_milik_godot_project.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Game ZIP not found!"
            echo "Upload escape_from_milik_godot_project.zip to repository root."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted_project"

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -type f -name "project.godot" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Game project found: $PROJECT_DIR"

      - name: Download Godot
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/godot"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O "$RUNNER_TEMP/godot/godot.zip"

          unzip -q "$RUNNER_TEMP/godot/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          GODOT_BIN=$(find "$RUNNER_TEMP/godot" \
            -type f -name "Godot_v*-stable_linux.x86_64" | head -n 1)

          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$RUNNER_TEMP/godot/godot"

          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Download Android export templates
        shell: bash
        run: |
          set -e

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -O "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          unzip -q "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/godot_templates"

          cp -a "$RUNNER_TEMP/godot_templates/templates/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          set -e
          godot --version
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/builds"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/builds/EscapeFromMilik.apk"

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/builds/EscapeFromMilik.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$(du -m "$APK" | cut -f1)

          echo "APK size: ${SIZE_MB} MB"

          if [ "$SIZE" -gt 103809024 ]; then
            echo "ERROR: APK is larger than 99 MiB!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Escape-From-Milik-Android-APK
          path: builds/EscapeFromMilik.apk
          if-no-files-found: error
          retention-days: 14
